          type: ["integer", "null"]
        connectionName:
          type: ["string", "null"]
        recordCount:
          type: ["integer", "null"]
        errorMessage:
          type: ["string", "null"]
        startedAt:
          type: ["string", "null"]
          format: date-time
        finishedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    DataJobListResponse:
