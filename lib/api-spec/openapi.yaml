      properties:
        totalUsers:
          type: integer
        activeUsers:
          type: integer
        inactiveUsers:
          type: integer
        mfaEnabledUsers:
          type: integer
        usersByRole:
          type: array
          items:
            type: object
            required: [roleName, count]
            properties:
              roleName:
                type: string
              count:
                type: integer
        recentLogins:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogEntry"

    AuditLogEntry:
      type: object
      required: [id, userId, userEmail, action, details, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: ["integer", "null"]
        userEmail:
          type: ["string", "null"]
        action:
          type: string
        details:
          type: ["string", "null"]
        ipAddress:
          type: ["string", "null"]
        resourceType:
          type: ["string", "null"]
        resourceId:
          type: ["string", "null"]
        fieldName:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    AuditLogResponse:
      type: object
      required: [entries, total, page, pageSize]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogEntry"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    # ─── PII ─────────────────────────────────────────────────────────────────

    PiiRecordMasked:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        company:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        nationalId:
          type: ["string", "null"]
        bankAccount:
          type: ["string", "null"]
        panNumber:
          type: ["string", "null"]
        emailCounterparty:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    PiiRecordListResponse:
      type: object
      required: [records, total, page, pageSize]
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/PiiRecordMasked"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

    PiiRecordInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        company:
          type: string
        phone:
          type: string
        nationalId:
          type: string
        bankAccount:
          type: string
        panNumber:
          type: string
        emailCounterparty:
          type: string
        address:
          type: string

    PiiRevealInput:
      type: object
      required: [recordId, fieldName]
      properties:
        recordId:
          type: integer
        fieldName:
          type: string
