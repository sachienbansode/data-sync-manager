          type: string
        transformType:
          type: string
          enum: [string, number, date-format]
        transformParams:
          type: ["string", "null"]
        sortOrder:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    FieldMappingsUpdate:
