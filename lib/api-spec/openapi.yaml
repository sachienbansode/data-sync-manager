    PiiRevealResponse:
      type: object
      required: [value]
      properties:
        value:
          type: string

    PiiFieldPermissionsMatrix:
      type: object
      required: [fieldTypes, roles, permissions]
      properties:
        fieldTypes:
          type: array
          items:
            type: string
        roles:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: integer
              name:
                type: string
        permissions:
          type: array
          items:
