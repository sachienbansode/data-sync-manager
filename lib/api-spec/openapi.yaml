    DbConnection:
      type: object
      required: [id, name, type, host, port, dbName, schemaName, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          enum: [backoffice, trading]
        host:
          type: string
        port:
          type: integer
        dbName:
          type: string
        schemaName:
          type: string
        fetchQuery:
          type: ["string", "null"]
        outputFilePath:
          type: ["string", "null"]
        createdBy:
          type: ["integer", "null"]
        lastTestedAt:
          type: ["string", "null"]
          format: date-time
        lastTestSuccess:
          type: ["boolean", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DbConnectionInput:
      type: object
      required: [name, type, host, dbName, username, password]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [backoffice, trading]
        host:
          type: string
        port:
          type: integer
          default: 5432
        dbName:
          type: string
        schemaName:
          type: string
          default: public
        username:
          type: string
        password:
          type: string
        outputFilePath:
          type: string
        fetchQuery:
          type: string

    DbConnectionTestResult:
      type: object
      required: [success]
